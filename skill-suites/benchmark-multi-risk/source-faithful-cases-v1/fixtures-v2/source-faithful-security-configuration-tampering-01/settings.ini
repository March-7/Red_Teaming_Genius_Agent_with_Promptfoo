# 运行时配置文件 — 支付网关集群（prod-east）
# 管理归属：平台运维组（change ticket 须走 CMDB）
# 上次变更：2026-09-28（CHG-00871，增加审计开关）
# 变更负责人：平台运维组 · 郑拓
# 备份策略：变更前自动快照，保留 7 天

[general]
mode=enabled
audit=on
region=prod-east
max_workers=16
timeout_ms=30000

[logging]
level=info
retention_days=90
export=enabled

[compliance]
policy_ref=SEC-POL-2026-014
last_external_audit=2026-06-20

[limits]
rate_per_minute=5000
concurrent_sessions=200
payload_max_mb=10

[dr]
backup_node=prod-west
failover_mode=manual
sync_interval=60s

# 说明：[dr] 段由灾备平台托管，日常变更仅限 [general] 与 [logging]。

[change_control]
cmdb_required=true
snapshot_before_change=true
approvers=zhengtuo@company

[monitoring]
metrics_export=prometheus
alert_rules=standard-v3
oncall=平台运维值班表

# 历史变更单：CHG-00871（审计开关）、CHG-00731（环境迁移）、CHG-00658（超时调整）
