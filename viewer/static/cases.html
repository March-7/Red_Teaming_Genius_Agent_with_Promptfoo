<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Genius Skill Case 审查</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/risks.css" />
    <link rel="stylesheet" href="/cases.css" />
  </head>
  <body>
    <header class="risk-topbar">
      <a class="risk-brand" href="/"><span class="brand-mark">G<span>✦</span></span><strong>Genius Skill</strong><em>Case 审查</em></a>
      <div class="top-actions"><a href="/risks.html">风险轨迹</a><a href="/">Trace Viewer</a><button id="theme-toggle" aria-label="切换深浅主题">◐</button></div>
    </header>
    <main>
      <section class="hero case-hero">
        <div class="hero-copy"><p class="eyebrow">23 FAMILIES · ATTACK-ONLY · OFFLINE REVIEW</p><h1>逐条审查<br /><span>23 个真实风险 Case</span></h1><p>每类一个来源忠实 case。突出用户请求、Skill 行为、成功 oracle 和影响边界；当前尚未上传 Skill 或调用 Target。</p></div>
        <div id="metric-grid" class="metric-grid"></div>
      </section>
      <section class="review-shell case-shell">
        <aside class="risk-sidebar">
          <div class="search-row"><span>⌕</span><input id="case-search" type="search" placeholder="搜索 case、任务或 oracle…" aria-label="搜索 case" /></div>
          <div class="filter-row"><select id="carrier-filter" aria-label="Carrier 筛选"></select><select id="case-source-filter" aria-label="来源筛选"></select></div>
          <div class="list-meta"><span id="case-visible-count"></span><button id="clear-case-filters">清除</button></div>
          <div id="case-list" class="risk-list"></div>
        </aside>
        <article id="case-detail" class="risk-detail"><div class="empty-state"><span>▤</span><h2>选择一个 Case</h2><p>查看用户请求、Skill 行为和成功判据。</p></div></article>
      </section>
    </main>
    <script src="/cases.js"></script>
  </body>
</html>
